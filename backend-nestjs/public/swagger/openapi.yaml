        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsableUpdate'
      responses:
        '200':
          description: Responsable actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeExito'
        '400':
          description: Datos inválidos

  /api/compras-credito/responsables/{id}:
