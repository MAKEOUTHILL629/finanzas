# ====================================
# CONFIGURACIÓN DE BASE DE DATOS
# ====================================
db.default.driver = org.postgresql.Driver
db.default.url = ${?DB_URL}
db.default.username = ${?DB_USER}
db.default.password = ${?DB_PASSWORD}

# Pool de conexiones optimizado para t2.micro
db.default.hikaricp.maximumPoolSize = 5
db.default.hikaricp.minimumIdle = 2

# ====================================
# SEGURIDAD DE LA APLICACIÓN
# ====================================
play.http.secret.key = ${?APP_SECRET}
jwt.expiration = ${?JWT_EXPIRATION}

# Deshabilitar CSRF para API REST
play.filters.disabled += play.filters.csrf.CSRFFilter

# Habilitar filtros personalizados
play.http.filters = "controllers.filters.Filters"

# ====================================
# ALLOWED HOSTS (Seguridad)
# ====================================
play.filters.hosts {
  allowed = ["."]
}

# ====================================
# CORS CONFIGURATION
# ====================================
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = ["http://localhost:4200", "http://localhost:3000", "d2k6anvt1vxcuu.cloudfront.net", "https://www.makefinanzas.lat","makefinanzas.lat" ]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization", "X-Requested-With"]
  exposedHeaders = ["Content-Type", "Authorization"]
  supportsCredentials = true
  preflightMaxAge = 3600 seconds
}

# ====================================
# THREAD POOL PARA BASE DE DATOS
# ====================================
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 5
  }
}

# ====================================
# CONFIGURACIÓN DE SERVIDOR
# ====================================
play.server.http.port = 9000
play.server.http.address = "0.0.0.0"

# Timeouts
play.server.http.idleTimeout = 120s
play.server.akka.requestTimeout = 120s

# ====================================
# LOGGING
# ====================================
play.logger.includeConfigProperties = true

# ====================================
# CONTEXTO DE LA APLICACIÓN
# ====================================
play.http.context = ${?PLAY_HTTP_CONTEXT}

